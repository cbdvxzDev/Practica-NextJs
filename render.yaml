# Backend en Render (Blueprint). Repo conectado > New > Blueprint, y este
# archivo crea el servicio web con el JAR de Maven dentro de una imagen
# Docker (Render no tiene runtime nativo para Java: docker es el camino).
#
# Pasos previos:
#   1. MongoDB Atlas (M0) -> copiar la URI en el secret MONGO_URI
#   2. Definir el dominio del front en CORS_ALLOWED_ORIGINS
#      (https://<tu-sitio>.netlify.app, sin barra final)
# El health check /api/health devuelve 503 si MongoDB no responde, que es lo
# que Render usa para sacar de rotación una instancia caída.
services:
  - type: web
    name: esencial-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://e-commerceesencial.netlify.app
      # Siembra el catalogo y las cuentas de prueba en el primer arranque.
      - key: APP_SEED
        value: "1"
